[package]
name = "Rukia-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serenity = {
    version = "0.12.5",
    default-features = false,
    features = [
        "client",
        "gateway",
        "model",
        "rustls_backend",
        "cache"
    ]
}
songbird = { version = "0.6.0", features = ["serenity"]}
dotenvy = "0.15"
